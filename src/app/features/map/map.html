<!-- src/app/features/map/map.html -->
<div class="map-root">
  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div class="logo-text">Map<span>Hide</span>.com</div>
    </div>

    <div class="actions">
      <button class="secondary" (click)="toggleSatellite()">
        {{ isSatellite ? 'Map' : 'Satellite' }}
      </button>

      <!-- Not logged in -->
      <ng-container *ngIf="!isLoggedIn()">
        <a routerLink="/auth/login">Sign In</a>
        <a routerLink="/auth/register" class="primary">Register</a>
      </ng-container>

      <!-- Logged in -->
      <ng-container *ngIf="isLoggedIn()">
        <a class="welcome-link" routerLink="/profile">
          Hi, {{ user()?.email }}
        </a>
        <button class="secondary" (click)="userStore.logout()">Logout</button>
      </ng-container>
    </div>
  </div>

  <div #eventLayer class="map-shell event-layer">
    <div #mapContainer class="map-container"></div>

    <!-- grid lines -->
    <canvas #gridCanvas class="grid-layer"></canvas>

    <!-- ✅ markers (visible, non-hidden drops) -->
    <canvas #markersCanvas class="markers-layer"></canvas>

    <!-- hover highlight -->
    <canvas #hoverCanvas class="hover-layer"></canvas>
  </div>

  <div class="help-panel">
    <h4>How It Works</h4>
    <ul>
      <li>Zoom to level 19+ to reveal grid</li>
      <li>Click any cell to store data</li>
      <li>Return to exact cell to retrieve</li>
    </ul>
  </div>

  <!-- CREATE DROP MODAL -->
  <mh-drop-create *ngIf="dropModalOpen" [lat]="dropLat!" [lng]="dropLng!" [saving]="dropSaving" [error]="dropError" [requireAuth]="!isLoggedIn()"
    (close)="closeDropModal()" (save)="onCreateDrop($event)" (login)="goLogin()"
    (register)="goRegister()"></mh-drop-create>

  <!-- EXISTING DROP MODAL -->
  <mh-drop-view *ngIf="existingModalOpen" [drops]="existingDrops" [decrypting]="decrypting" [error]="decryptError"
    (close)="closeExistingModal()" (decrypt)="onUnlockDrop($event)"
    (download)="onDownloadDropFile($event)"></mh-drop-view>
</div>
