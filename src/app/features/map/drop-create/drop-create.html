<div class="drop-modal-backdrop" (click)="close.emit()">
    <div class="drop-modal" (click)="$event.stopPropagation()">

        <div class="drop-modal-header">
            <h2>Create Drop</h2>
            <button class="close-btn" type="button" (click)="close.emit()">✕</button>
        </div>

        <div class="drop-modal-body">
            <p class="coords">
                Location:
                <span>{{ lat | number:'1.5-5' }}, {{ lng | number:'1.5-5' }}</span>
            </p>

            <label class="field">
                <span>Message</span>
                <textarea rows="4" [(ngModel)]="message" (ngModelChange)="message.set($event)"
                    placeholder="Enter your secret..."></textarea>
            </label>

            <label class="field">
                <span>Attach file (optional)</span>
                <input type="file" (change)="onFileSelected($event)" accept="application/pdf" />
                <small *ngIf="selectedFileName()">
                    Selected: {{ selectedFileName() }} ({{ selectedFileSize() }} bytes)
                </small>
            </label>


            <label class="field checkbox">
                <input type="checkbox" [(ngModel)]="passwordLock" (ngModelChange)="passwordLock.set($event)" />
                <span>Password protect this drop</span>
            </label>

            <label class="field" *ngIf="passwordLock()">
                <span>Password</span>
                <input type="password" [(ngModel)]="password" (ngModelChange)="password.set($event)" />
            </label>

            <label class="field checkbox">
                <input type="checkbox" [(ngModel)]="otcLock" />
                <span>One-time code lock</span>
            </label>

            <label class="field checkbox">
                <input type="checkbox" [(ngModel)]="gpsLock" />
                <span>GPS lock</span>
            </label>

            <label class="field checkbox">
                <input type="checkbox" [(ngModel)]="hidden" (ngModelChange)="hidden.set($event)" />
                <span>Hidden drop</span>
            </label>

            <p class="error" *ngIf="error">{{ error }}</p>
        </div>

        <div class="auth-overlay" *ngIf="requireAuth" (click)="$event.stopPropagation()">
            <div class="auth-card">
                <h3>You have to be logged in to use the features.</h3>
                <p>Register or login to create drops!</p>

                <div class="auth-actions">
                    <button class="secondary" type="button" (click)="login.emit()">Login</button>
                    <button class="primary" type="button" (click)="register.emit()">Register</button>
                </div>

                <button class="link" type="button" (click)="close.emit()">Cancel</button>
            </div>
        </div>

        <div class="drop-modal-footer">
            <button type="button" class="secondary" (click)="close.emit()">Cancel</button>
            <button type="button" class="primary" [disabled]="saving" (click)="submit()">
                {{ saving ? 'Saving…' : 'Save Drop' }}
            </button>
        </div>

    </div>
</div>
